<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy 24ct Gold</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fffbe6;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1, h2 {
      color: #b8860b;
      margin: 10px 0;
    }
    .logo { text-align: center; margin-bottom: 10px; }
    .logo img { max-width: 150px; }
    .logo-text { font-size: 0.95em; font-weight: bold; color: #333; text-align: center; margin-bottom: 20px; }
    .form-container, .payment-container, .success-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      margin-bottom: 20px;
    }
    label { display: block; margin-top: 10px; font-weight: bold; }
    select, input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; font-size: 1em; }
    .summary { margin-top: 15px; font-size: 1em; }
    button { background: #b8860b; color: white; border: none; padding: 12px; margin-top: 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1em; }
    .payment-container { display: none; border: 2px solid #b8860b; }
    .payment-container h2 { margin-top: 0; }
    .upi-box { margin-top: 15px; background: #f9f9f9; padding: 15px; border: 1px dashed #b8860b; border-radius: 5px; word-break: break-word; font-size: 0.95em; text-align: center; }
    .gold-rate { margin-top: 10px; font-size: 1.1em; color: #333; font-weight: bold; text-align: center; }
    .success-container { display: none; border: 2px solid #8fbc8f; background: #e6ffed; text-align: center; }
    @media screen and (max-width: 480px) { body { padding: 10px; } .form-container, .payment-container { padding: 15px; } }
  </style>
</head>
<body>
  <div class="logo">
    <img src="ranka logo.png" alt="Ranka Jewellers Logo">
  </div>
  <div class="logo-text">SKIP THE LINE AT RANKA JEWELLERS NAGAR ROAD KHARADI TODAY.</div>

  <h1>Buy 24ct Gold</h1>
  <div class="gold-rate">Today's 24ct Gold Rate: ₹95,900 / 10g</div>

  <div class="form-container" id="formContainer">
    <label for="weight">Select Weight (grams):</label>
    <select id="weight"><option value="0.5">0.5g</option><option value="1">1g</option><option value="2">2g</option><option value="5">5g</option><option value="10">10g</option></select>

    <label for="name">Full Name:</label>
    <input type="text" id="name" placeholder="Your name">

    <label for="number">Phone Number:</label>
    <input type="text" id="number" placeholder="Your number">

    <label for="address">Address:</label>
    <input type="text" id="address" placeholder="Your address">

    <div class="summary"><p id="priceDisplay">Total: ₹0.00 (incl. GST)</p></div>
    <button id="calcBtn" onclick="calculatePrice()">Calculate & Show Payment Options</button>
  </div>

  <div class="payment-container" id="paymentContainer">
    <h2>Payment Options</h2>
    <div class="upi-box">
      <p>Amount: ₹<span id="finalAmount"></span></p>
      <p>UPI ID: <strong>9823512576@pthdfc</strong></p>
      <a id="upiLink" href="#" target="_blank"><button style="margin-top:10px; background:#4caf50;">Open UPI App</button></a>
      <div style="margin:15px 0;">or scan QR code:</div>
      <img id="qrCode" alt="UPI QR Code" style="width:150px;height:150px;margin:auto;display:block;" />
      <button onclick="confirmPayment()" style="margin-top:15px; background:#007bff;">I Have Paid</button>
    </div>
  </div>

  <div class="success-container" id="successContainer">
    <h2>Payment Successful!</h2>
    <p>Your Order Number:</p>
    <h3 id="orderNo"></h3>
    <p>Thank you for shopping at Ranka Jewellers.</p>
  </div>

  <script>
    const baseRate = 95900;

    function calculatePrice() {
      const weight = parseFloat(document.getElementById('weight').value);
      const name = document.getElementById('name').value || 'Gold Buyer';
      const priceWithoutGst = (baseRate * weight) / 10;
      const gst = priceWithoutGst * 0.03;
      const total = priceWithoutGst + gst;
      const rounded = total.toFixed(2);
      document.getElementById('priceDisplay').innerText = `Total: ₹${rounded} (incl. GST)`;
      document.getElementById('finalAmount').innerText = rounded;

      const upiID = '9823512576@pthdfc';
      const narration = encodeURIComponent(`Gold purchase by ${name}`);
      const upiUrl = `upi://pay?pa=${upiID}&pn=${encodeURIComponent(name)}&am=${rounded}&cu=INR&tn=${narration}`;
      document.getElementById('upiLink').href = upiUrl;
      document.getElementById('qrCode').src = `https://chart.googleapis.com/chart?cht=qr&chs=200x200&chl=${encodeURIComponent(upiUrl)}`;

      document.getElementById('paymentContainer').style.display = 'block';
      document.getElementById('paymentContainer').scrollIntoView({ behavior: 'smooth' });
      document.getElementById('calcBtn').disabled = true;
    }

    function confirmPayment() {
      const orderNo = 'ORD' + Date.now();
      document.getElementById('orderNo').innerText = orderNo;
      document.getElementById('formContainer').style.display = 'none';
      document.getElementById('paymentContainer').style.display = 'none';
      document.getElementById('successContainer').style.display = 'block';
      document.getElementById('successContainer').scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
