
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy 24ct Gold</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fffbe6;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1, h2 {
      color: #b8860b;
    }
    .logo {
      text-align: center;
      margin-bottom: 10px;
    }
    .logo img {
      max-width: 150px;
    }
    .logo-text {
      font-size: 0.95em;
      font-weight: bold;
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 1em;
    }
    .summary {
      margin-top: 15px;
      font-size: 1em;
    }
    button {
      background: #b8860b;
      color: white;
      border: none;
      padding: 12px;
      margin-top: 15px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 1em;
    }
    .upi-box {
      margin-top: 15px;
      background: #f9f9f9;
      padding: 10px;
      border: 1px dashed #999;
      border-radius: 5px;
      word-break: break-word;
      font-size: 0.95em;
    }
    .gold-rate {
      margin-top: 10px;
      font-size: 1.1em;
      color: #333;
      font-weight: bold;
      text-align: center;
    }
    @media screen and (max-width: 480px) {
      body {
        padding: 10px;
      }
      .form-container {
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="ranka logo.png" alt="Ranka Jewellers Logo">
  </div>
  <div class="logo-text">SKIP THE LINE AT RANKA JEWELLERS NAGAR ROAD KHARADI TODAY.</div>

  <h1>Buy 24ct Gold</h1>
  <div class="gold-rate">Today's 24ct Gold Rate: ₹95,900 / 10g</div>

  <div class="form-container">
    <label for="weight">Select Weight (grams):</label>
    <select id="weight">
      <option value="0.5">0.5g</option>
      <option value="1">1g</option>
      <option value="2">2g</option>
      <option value="5">5g</option>
      <option value="10">10g</option>
    </select>

    <label for="name">Full Name:</label>
    <input type="text" id="name" placeholder="Your name">

    <label for="number">Phone Number:</label>
    <input type="text" id="number" placeholder="Your number">

    <label for="address">Address:</label>
    <input type="text" id="address" placeholder="Your address">

    <div class="summary">
      <p id="priceDisplay">Total: ₹0.00 (incl. GST)</p>
    </div>

    <button onclick="calculatePrice()">Calculate & Show UPI</button>

    <div id="upiDetails" class="upi-box" style="display:none;">
      <p>Pay ₹<span id="finalAmount"></span> via UPI to:</p>
      <strong>9823512576@pthdfc</strong>
      <br><br>
      <a id="upiLink" href="#" target="_blank">
        <button style="margin-top:10px; background:#4caf50;">Pay Now</button>
      </a>
    </div>
  </div>

  <script>
    const baseRate = 95900;

    function calculatePrice() {
      const weight = parseFloat(document.getElementById('weight').value);
      const nameField = document.getElementById('name');
      const name = nameField.value || "Gold Buyer";

      const priceWithoutGst = (baseRate * weight) / 10;
      const gst = priceWithoutGst * 0.03;
      const total = priceWithoutGst + gst;
      const roundedTotal = total.toFixed(2);

      document.getElementById('priceDisplay').innerText = `Total: ₹${roundedTotal} (incl. GST)`;
      document.getElementById('finalAmount').innerText = roundedTotal;
      document.getElementById('upiDetails').style.display = 'block';

      const upiID = "9823512576@pthdfc";
      const narration = encodeURIComponent(`Gold purchase by ${name}`);
      const upiUrl = `upi://pay?pa=${upiID}&pn=${encodeURIComponent(name)}&am=${roundedTotal}&cu=INR&tn=${narration}`;

      document.getElementById('upiLink').href = upiUrl;
    }
  </script>
</body>
</html>
